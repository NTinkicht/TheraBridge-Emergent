name: m4-web-renderer-dependency-export

on:
  push:
    branches:
      - test/m4-08-web-60-mega-coverage
    paths:
      - '.github/workflows/m4-web-renderer-dependency-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: yarn
      - name: Resolve only the pinned React renderer test dependency
        run: |
          yarn install --frozen-lockfile
          yarn add --dev --exact --ignore-scripts --ignore-engines -W react-test-renderer@18.3.1
          node -e "const p=require('./package.json');if(p.devDependencies['react-test-renderer']!=='18.3.1')process.exit(2)"
      - name: Archive resolver-generated exact files for reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: m4-web-react-renderer-lock-${{ github.run_id }}
          path: |
            package.json
            yarn.lock
          if-no-files-found: error
          retention-days: 1
