name: qa-readonly-contracts
on:
  push:
    paths:
      - scripts/qa/hosted-readonly.mjs
      - scripts/qa/hosted-readonly.test.mjs
      - scripts/qa/private-runner.test.mjs
      - scripts/qa/hosted-workflow-paths.test.mjs
      - scripts/qa/pinned-browser-smoke.mjs
      - scripts/qa/evidence-crypto.mjs
      - scripts/qa/prepare-hosted-run.mjs
      - .github/workflows/hosted-responsive-private.yml
      - .github/workflows/qa-readonly-contracts.yml
  pull_request:
    paths:
      - scripts/qa/hosted-readonly.mjs
      - scripts/qa/hosted-readonly.test.mjs
      - scripts/qa/private-runner.test.mjs
      - scripts/qa/hosted-workflow-paths.test.mjs
      - scripts/qa/pinned-browser-smoke.mjs
      - scripts/qa/evidence-crypto.mjs
      - scripts/qa/prepare-hosted-run.mjs
      - .github/workflows/hosted-responsive-private.yml
      - .github/workflows/qa-readonly-contracts.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check Gitleaks TOML configuration parses cleanly
        run: python3 -c 'import tomllib; tomllib.load(open(".gitleaks.toml","rb"))'
      - name: Run offline QA contract suite only (no secrets or external requests)
        run: node --test scripts/qa/hosted-readonly.test.mjs scripts/qa/private-runner.test.mjs scripts/qa/hosted-workflow-paths.test.mjs
  preinstalled-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install exact locked Playwright JavaScript dependency (no browser download)
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Prove preinstalled Chromium launches at five real CSS widths
        run: node scripts/qa/pinned-browser-smoke.mjs
