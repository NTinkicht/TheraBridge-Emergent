name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@localhost:5432/therabridge_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - run: yarn workspace @therabridge/api prisma migrate deploy
      - run: yarn workspace @therabridge/api typecheck
      - run: yarn workspace @therabridge/api test
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8001

  compose:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test through the running containers
        run: |
          curl -fsS http://localhost:8001/api/health
          curl -fsS -X POST http://localhost:8001/api/health/probe -H 'Content-Type: application/json' -d '{"label":"ci-compose-probe","source":"cli"}'
          curl -fsS http://localhost:8001/api/health/probe | grep -q ci-compose-probe
          curl -fsS http://localhost:3000/ | grep -q TheraBridge
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
