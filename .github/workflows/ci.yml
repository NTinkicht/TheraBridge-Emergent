name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Superseded pushes to the same ref should not consume two costly Docker jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smart-plan:
    name: smart-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      candidate: ${{ steps.select.outputs.candidate }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate complete PR diff and conservative risk plan
        id: select
        env:
          TB_SMART_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TB_SMART_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TB_SMART_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TB_SMART_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          TB_SMART_CI_MODE: ${{ vars.TB_SMART_CI_MODE }}
          TB_SMART_CI_REQUIRED_GATE_READY: ${{ vars.TB_SMART_CI_REQUIRED_GATE_READY }}
        run: node scripts/ci/smart-ci.mjs

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate SBOM contract and negative cases
        run: node --test scripts/commercial/check-sbom.test.mjs scripts/commercial/reconcile-sbom.test.mjs
      - name: Generate fresh CycloneDX source SBOM for this commit (includes yarn.lock)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: therabridge-source-${{ github.sha }}.cyclonedx.json
          output-file: /tmp/therabridge-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Reconcile lockfile-only packages and retain scanner provenance
        run: node scripts/commercial/reconcile-sbom.mjs /tmp/therabridge-source.cdx.json yarn.lock /tmp/therabridge-reconciled.cdx.json
      - name: Fail closed unless every Yarn resolved name/version is in source SBOM
        run: node scripts/commercial/check-sbom.mjs /tmp/therabridge-reconciled.cdx.json source
      - name: Verify upstream evidence ledger covers every direct dependency
        run: |
          node --test scripts/commercial/check-direct-evidence.test.mjs
          node scripts/commercial/check-direct-evidence.mjs
      - name: Validate license risk classifier and review queue invariants
        run: node --test scripts/commercial/classify-sbom.test.mjs
      - name: Classify all source components with approval fail-closed
        run: node scripts/commercial/classify-sbom.mjs /tmp/therabridge-reconciled.cdx.json /tmp/therabridge-license-review.json /tmp/therabridge-third-party-notices-REVIEW.md
      - name: Archive per-commit license review queue (not a legal clearance)
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-license-review-${{ github.sha }}
          path: |
            /tmp/therabridge-license-review.json
            /tmp/therabridge-third-party-notices-REVIEW.md
          if-no-files-found: error
          retention-days: 30
      - name: Archive reconciled CycloneDX SBOM for PR or main commit
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-source-${{ github.sha }}.cyclonedx.json
          path: /tmp/therabridge-reconciled.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate tracked brand/media/container asset evidence
        run: |
          node scripts/commercial/asset-inventory.mjs > /tmp/therabridge-assets.json
          node -e 'const a=require("/tmp/therabridge-assets.json");if(!a.total||!a.assets.every(x=>x.licenseStatus==="NOT_VERIFIED"))process.exit(1);console.log("Tracked asset entries:",a.total)'
      - name: Archive per-commit tracked-asset evidence
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-assets-${{ github.sha }}
          path: /tmp/therabridge-assets.json
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (version- and checksum-pinned)
        run: |
          # The GitHub release endpoint occasionally returns transient 5xx/504.
          # Retry the same pinned artifact; never skip the SHA-256 verification.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 90 \
            -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan full Git history (all fetched refs), values redacted
        run: |
          set +e
          /tmp/gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact=100 --no-banner --report-format=json --report-path=/tmp/tb-secret-scan.json --exit-code 1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            # Print rule, tracked file and source location only: NEVER leak matched text, snippets or secrets.
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/tb-secret-scan.json","utf8"));for(const x of a)console.log("SCAN_FINDING_RULE_PATH "+JSON.stringify({rule:x.RuleID,file:x.File,line:x.StartLine,commit:x.Commit}));'
          fi
          rm -f /tmp/tb-secret-scan.json
          exit "$result"
      - name: Scan tracked files in this checkout, values redacted
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1

  test:
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@localhost:5432/therabridge_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Smart CI classifier, policy gate and workflow wiring
        run: node --test scripts/ci/smart-ci.test.mjs scripts/ci/smart-ci-workflow.test.mjs
      - name: Required portability files are present
        run: |
          for f in yarn.lock .env.example apps/api/.env.example apps/web/.env.example .nvmrc; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Verify canonical roadmap register integrity and negative-path regressions
        run: |
          node scripts/qa/check-roadmap-registers.mjs
          node --test scripts/qa/check-roadmap-registers.test.mjs
      - name: M4-09 historical issue evidence register and negative regression tests
        run: |
          node scripts/qa/check-historic-issues.mjs
          node --test scripts/qa/check-historic-issues.test.mjs
      - name: M4-09 reconcile all frozen issue IDs against GitHub-state snapshot without auto closure
        run: |
          node --test scripts/qa/m4-historic-state-reconcile.test.mjs
          node scripts/qa/m4-historic-state-reconcile.mjs
      - name: M4-03 independent credential generator and recovery tests
        run: node --test scripts/preview/generate-secrets.test.mjs
      - name: M4-02 private hosted scope and workflow safety regressions
        run: node --test scripts/qa/hosted-extra-contracts.test.mjs scripts/qa/hosted-role-guards.test.mjs scripts/qa/hosted-session-guards.test.mjs scripts/qa/hosted-private-workflow.test.mjs scripts/qa/prepare-hosted-run.test.mjs
      - run: yarn install --frozen-lockfile
      - name: Verify exact-installed package license file inventory tooling
        run: node --test scripts/commercial/collect-installed-licenses.test.mjs
      - name: Collect installed package license-file hashes (review evidence only)
        run: node scripts/commercial/collect-installed-licenses.mjs . /tmp/therabridge-installed-licenses.json
      - name: Validate installed license review triage and fail-closed safeguards
        run: node --test scripts/commercial/build-installed-license-review.test.mjs
      - name: Produce version-specific installed LICENSE/NOTICE triage (not legal approval)
        run: node scripts/commercial/build-installed-license-review.mjs /tmp/therabridge-installed-licenses.json /tmp/therabridge-installed-license-review.json
      - name: Validate Yarn lockfile installed-provenance review and adversarial fixtures
        run: node --test scripts/commercial/reconcile-installed-lock.test.mjs
      - name: Reconcile exact installed versions to frozen Yarn lock metadata (not tarball verification)
        run: node scripts/commercial/reconcile-installed-lock.mjs /tmp/therabridge-installed-license-review.json yarn.lock /tmp/therabridge-installed-lock-provenance.json
      - name: Validate published tarball verification tooling (offline adversarial tests)
        run: node --test scripts/commercial/verify-published-tarballs.test.mjs
      - name: Verify all installed direct npm tarballs and compare on-disk LICENSE/NOTICE hashes
        run: node scripts/commercial/verify-published-tarballs.mjs /tmp/therabridge-installed-lock-provenance.json yarn.lock docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-publisher-tarball-evidence.json
      - name: Validate consolidated transitive and asset obligations queue
        run: node --test scripts/commercial/build-com02-obligations-queue.test.mjs
      - name: Collect transitive dependencies and tracked assets for legal-review matrix
        run: node scripts/commercial/build-com02-obligations-queue.mjs docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-publisher-tarball-evidence.json /tmp/therabridge-com02-obligations-queue.json
      - name: Validate bounded transitive publisher tarball audit safeguards
        run: node --test scripts/commercial/verify-transitive-tarballs.test.mjs
      - name: Classify every installed non-direct npm version and verify tarball hashes (not license clearance)
        run: node scripts/commercial/verify-transitive-tarballs.mjs /tmp/therabridge-installed-lock-provenance.json yarn.lock docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-transitive-tarball-evidence.json
      - name: Validate exact-version license exception register fail-closed semantics
        run: node --test scripts/commercial/build-license-exception-register.test.mjs
      - name: Generate per-version unresolved license and SaaS/enterprise obligations register
        run: node scripts/commercial/build-license-exception-register.mjs /tmp/therabridge-publisher-tarball-evidence.json /tmp/therabridge-transitive-tarball-evidence.json /tmp/therabridge-installed-licenses.json yarn.lock /tmp/therabridge-com02-obligations-queue.json /tmp/therabridge-com02-exact-version-rights-queue.json
      - name: Validate exact npm registry manifest metadata candidates fail-closed
        run: node --test scripts/commercial/collect-upstream-license-candidates.test.mjs
      - name: Collect immutable exact-version registry metadata candidates (never legal clearance)
        run: node scripts/commercial/collect-upstream-license-candidates.mjs /tmp/therabridge-com02-exact-version-rights-queue.json /tmp/therabridge-com02-upstream-candidates.json
      - name: Validate candidate Git commit and immutable source package identity without false attestation
        run: node --test scripts/commercial/corroborate-source-revisions.test.mjs
      - name: Collect version-pinned source root manifest corroboration candidates (not legal authority)
        run: node scripts/commercial/corroborate-source-revisions.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-source-correspondence-candidates.json
      - name: Validate fail-closed exact-commit LICENSE/NOTICE text hashing
        run: node --test scripts/commercial/verify-immutable-license-texts.test.mjs
      - name: Reconcile immutable upstream text evidence without approving source correspondence
        run: node scripts/commercial/verify-immutable-license-texts.mjs /tmp/therabridge-com02-upstream-candidates.json docs/commercial/immutable-upstream-source-mappings.json /tmp/therabridge-com02-immutable-text-evidence.json
      - name: Archive installed license evidence for full CI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-installed-license-files-${{ github.sha }}
          path: |
            /tmp/therabridge-installed-licenses.json
            /tmp/therabridge-installed-license-review.json
            /tmp/therabridge-installed-lock-provenance.json
            /tmp/therabridge-publisher-tarball-evidence.json
            /tmp/therabridge-com02-obligations-queue.json
            /tmp/therabridge-transitive-tarball-evidence.json
            /tmp/therabridge-com02-exact-version-rights-queue.json
            /tmp/therabridge-com02-upstream-candidates.json
            /tmp/therabridge-com02-source-correspondence-candidates.json
            /tmp/therabridge-com02-immutable-text-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: M4-02 private QA runtime redaction and fail-closed tests
        run: node --test scripts/qa/hosted-extra-runtime.test.mjs
      - name: Verify migration guard negative-path tests
        run: node --test scripts/qa/check-migration-history.test.mjs
      - name: Enforce immutable published migration history against PR base or previous main
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/qa/check-migration-history.mjs
      - run: yarn workspace @therabridge/api prisma generate
      - name: M4-06 staged migration/runtime database-role separation contract
        run: node --test scripts/preview/db-role-config.test.mjs scripts/preview/verify-runtime-db-role.test.mjs
      - name: M4-06 disposable migration replay safety contracts
        run: node --test scripts/qa/m4-disposable-replay.test.mjs
      - name: M4-06 fresh/historical migration replay, rollback, contention and restore
        timeout-minutes: 8
        env:
          TB_M4_DISPOSABLE_CONFIRM: I_AUTHORIZE_DISPOSABLE_LOCAL_DOCKER
        run: bash scripts/qa/m4-disposable-replay.sh
      - name: Check additive migration after TB-EM-012 was already applied
        run: |
          # Migrate the CI database using the original through-012 chain first,
          # then deploy current migrations against the SAME persisted database.
          # This catches in-place migration edits that fresh-database CI misses.
          mkdir -p /tmp/therabridge-prior
          cp apps/api/prisma/schema.prisma /tmp/therabridge-prior/schema.prisma
          cp -a apps/api/prisma/migrations /tmp/therabridge-prior/migrations
          rm -rf /tmp/therabridge-prior/migrations/20261030090000_tb_em_013_guardian_audience_requires_recipient
          rm -rf /tmp/therabridge-prior/migrations/20261101090000_tb_em_015_session_execution
          yarn workspace @therabridge/api prisma migrate deploy --schema /tmp/therabridge-prior/schema.prisma
          yarn workspace @therabridge/api prisma migrate deploy
          # The strengthened guardian constraint must now be present.
          # Prisma confirms all migrations applied on the previously migrated database.
          yarn workspace @therabridge/api prisma migrate status
      - run: yarn workspace @therabridge/api typecheck
      - name: Instrument full API source test coverage (measurement, not M4 95% acceptance)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.workspace/m4-coverage/api"
          yarn workspace @therabridge/api test --coverage --collectCoverageFrom='src/**/*.ts' --coverageReporters=json-summary --coverageDirectory="$GITHUB_WORKSPACE/.workspace/m4-coverage/api"
      - name: M4-08 independent full API branch/function hotspot audit (diagnostic only)
        run: |
          node --test scripts/qa/m4-api-coverage-hotspots.test.mjs
          node scripts/qa/m4-api-coverage-hotspots.mjs
      - name: Archive numeric-only API source hotspot diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: m4-api-hotspots-${{ github.run_id }}
          path: .workspace/m4-coverage/m4-api-hotspots.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate M4-07 reproducible synthetic measurement and sanitized receipt
        run: |
          node --test scripts/qa/m4-performance-evidence.test.mjs
          node scripts/qa/m4-performance-evidence.mjs .workspace/m4-performance/m4-07-synthetic-api.json
      - name: Archive M4-07 numeric-only CI measurement (NOT production acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: m4-performance-synthetic-${{ github.run_id }}
          path: .workspace/m4-performance/m4-07-synthetic-api.json
          if-no-files-found: error
          retention-days: 7
      - name: Gate measured API fingerprint-core coverage (95/90/95/95)
        run: yarn workspace @therabridge/api test:coverage:core
      - name: Web configuration unit tests with observed V8 instrumentation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.workspace/m4-coverage/web-v8"
          NODE_V8_COVERAGE="$GITHUB_WORKSPACE/.workspace/m4-coverage/web-v8" yarn workspace @therabridge/web test
      - name: Generate genuine full-scope Web Istanbul coverage and audit denominator
        run: |
          node --test scripts/qa/m4-web-coverage-audit.test.mjs scripts/qa/m4-measured-coverage.test.mjs
          ./node_modules/.bin/jest --config scripts/qa/m4-web-jest.config.cjs --runInBand
          node scripts/qa/m4-web-coverage-audit.mjs
      - name: M4-08 audited Web coverage hotspots for high-value tests (diagnostic only)
        run: |
          node --test scripts/qa/m4-web-coverage-hotspots.test.mjs
          node scripts/qa/m4-web-coverage-hotspots.mjs
      - name: Archive sanitized Web hotspot diagnostics (never clinical approval)
        uses: actions/upload-artifact@v4
        with:
          name: m4-web-hotspots-${{ github.run_id }}
          path: .workspace/m4-coverage/m4-web-hotspots.json
          if-no-files-found: error
          retention-days: 7
      - name: M4-08 independently cross-check real API + Web coverage and publish integrated aggregate
        env:
          TB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/qa/m4-integrated-coverage.test.mjs
          node scripts/qa/m4-integrated-coverage.mjs
      - name: Archive exact-run M4-08 integrated aggregate (NOT release approval)
        uses: actions/upload-artifact@v4
        with:
          name: m4-08-integrated-coverage-${{ github.run_id }}
          path: .workspace/m4-coverage/m4-08-integrated-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Archive aggregate-only M4 Web coverage receipt (NOT release gate)
        uses: actions/upload-artifact@v4
        with:
          name: m4-web-instrumented-baseline-${{ github.run_id }}
          path: .workspace/m4-coverage/m4-web-coverage-baseline.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish honest M4 application coverage measurement and Web gap
        run: |
          node --test scripts/qa/m4-app-coverage-baseline.test.mjs
          node scripts/qa/m4-app-coverage-baseline.mjs
      - name: Archive redacted measurement summary (NOT a release gate)
        uses: actions/upload-artifact@v4
        with:
          name: m4-coverage-baseline-${{ github.run_id }}
          path: .workspace/m4-coverage/m4-coverage-baseline.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify M4-08 suite inventory and truthfully scoped coverage baseline
        run: |
          node scripts/qa/check-ci-test-inventory.mjs
          node --test scripts/qa/check-ci-test-inventory.test.mjs
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - name: M2-H06 frontend timezone, CSRF, shared session and response-header regression
        run: node --test scripts/qa/m2-h06-frontend.test.mjs
      - run: node scripts/design/check-child360-logic.mjs
      - name: TB-EM-051 clinical transfer must remain unapproved and non-authorizing
        run: node scripts/qa/verify-tb-em-051-gates.mjs
      - run: node scripts/qa/verify-independent-review.mjs
        env:
          API_UPSTREAM_ORIGIN: http://127.0.0.1:8001

      - name: Session editor responsive DOM and synthetic dictation regression
        run: |
          yarn playwright install --with-deps chromium
          (cd apps/web && yarn start) > /tmp/therabridge-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/design/check-preview-entry.mjs
          node scripts/design/check-session-workflow.mjs

  live-session:
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full' || needs.smart-plan.outputs.mode == 'web-style'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_live_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_live_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_live_test?schema=public
      DEPLOYMENT_ENV: ci
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - run: yarn workspace @therabridge/api prisma migrate deploy
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - run: yarn playwright install --with-deps chromium
      - name: Real two-tab browser → API → PostgreSQL synthetic regression
        run: node scripts/design/run-session-live.mjs
      # Never upload seed credentials, browser storage, or traces.
      - if: always()
        run: rm -f .workspace/local-credentials/synthetic-accounts.json

  demo-journey:
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full' || needs.smart-plan.outputs.mode == 'web-style'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_demo_test?schema=public
      DEPLOYMENT_ENV: ci
      API_UPSTREAM_ORIGIN: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - run: yarn workspace @therabridge/api prisma migrate deploy
      - run: yarn workspace @therabridge/api typecheck
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - run: yarn playwright install --with-deps chromium
      - name: Idempotent synthetic Ahmed seed and real seven-role browser journey
        run: node scripts/design/run-demo-live.mjs
      - if: always()
        run: rm -f .workspace/local-credentials/childrens-home-demo.json

  compose:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: [smart-plan, test]
    if: needs.smart-plan.outputs.mode == 'full'
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Verify API and web runtime identities are non-root
        run: |
          test "$(docker compose exec -T api id -u)" = 1000
          test "$(docker compose exec -T web id -u)" = 1000
      - name: Smoke test through the running containers
        run: |
          curl -fsS http://localhost:8001/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "ok" and h["service"] == "therabridge-api" and h["database"]["status"] == "up" and h["migrations"]["applied"] >= 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/api/health/probe -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' -d '{"source":"cli"}')" = 404
          # Root is now the actual app, not TB-EM-000.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 307
          curl -fsS http://localhost:3000/login | grep -q 'Sign in to TheraBridge'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dev/feasibility)" = 404
          curl -fsS http://localhost:3000/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"]=="ok" and h["database"]["status"]=="up"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/health/probe -H 'Origin: https://untrusted.example' -H 'Content-Type: application/json' -d '{}')" = 403
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v


  preview-container:
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify preview entrypoint and public smoke syntax
        run: |
          bash -n scripts/preview/start.sh
          node --check scripts/preview/check-external.mjs
          node --check scripts/preview/generate-secrets.mjs
      - name: Build unified preview image
        run: docker build -f Dockerfile.preview -t tb-synthetic-preview:ci .
      - name: Generate container OS/runtime CycloneDX evidence from built preview image
        uses: anchore/sbom-action@v0
        with:
          image: tb-synthetic-preview:ci
          format: cyclonedx-json
          artifact-name: therabridge-preview-image-${{ github.sha }}.cyclonedx.json
          output-file: /tmp/therabridge-preview-image.cdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
          dependency-snapshot: false
      - name: Verify preview image SBOM structure
        run: node scripts/commercial/check-sbom.mjs /tmp/therabridge-preview-image.cdx.json image
      - name: Start isolated preview with disposable test passwords
        run: |
          umask 077
          node scripts/preview/generate-secrets.mjs
          cat > /tmp/therabridge-preview-ci.env <<'EOF'
          DATABASE_URL=postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_demo_test?schema=public
          DEPLOYMENT_ENV=preview
          DEMO_SEED_CONFIRM=CHILDRENS_HOME_SYNTHETIC_ONLY
          COOKIE_SECURE=true
          FAMILY_MESSAGING_DEMO=false
          PORT=10000
          API_UPSTREAM_ORIGIN=http://127.0.0.1:8001
          RENDER_EXTERNAL_HOSTNAME=therabridge-ahmed-synthetic-demo.onrender.com
          EOF
          printf 'DEMO_PASSWORDS_JSON=%s\n' "$(tr -d '\n' < .workspace/local-credentials/render-demo-passwords.json)" >> /tmp/therabridge-preview-ci.env
          printf 'DEMO_EXTRA_PASSWORDS_JSON=%s\n' "$(tr -d '\n' < .workspace/local-credentials/render-demo-extra-passwords.json)" >> /tmp/therabridge-preview-ci.env
          printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> /tmp/therabridge-preview-ci.env
          docker run -d --name tb-preview-ci --network host --memory 512m --memory-swap 512m --env-file /tmp/therabridge-preview-ci.env tb-synthetic-preview:ci
          test "$(docker exec tb-preview-ci id -u)" = 1000
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:10000/login >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/login | grep -q 'Sign in to TheraBridge'
          curl -fsS http://127.0.0.1:10000/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["database"]["status"]=="up" and h["migrations"]["applied"]>=16'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/dev/feasibility)" = 404
          docker exec tb-preview-ci node -e "const {PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.center.count({where:{slug:'childrens-home-demo'}}).then(n=>{if(n!==1)process.exitCode=1;else console.log('PASS: one Children Home demo centre seeded')}).finally(()=>p.\$disconnect())"
      - name: M4-07 reject forged/shortened 512MiB workload receipt
        run: node --test scripts/qa/m4-sustained-receipt.test.mjs
      - name: M4-07 sustained 10-minute synthetic API load with real 512MiB non-root preview cgroup
        timeout-minutes: 13
        env:
          TB_M4_LOCAL_LOAD_CONFIRM: DISPOSABLE_LOOPBACK_ONLY
        run: node scripts/qa/m4-local-sustained-http.mjs
      - name: Verify measured 10-minute synthetic workload receipt before publishing
        run: node scripts/qa/m4-sustained-receipt.mjs .workspace/m4-performance/m4-07-compose-load.json
      - name: Archive numeric-only M4-07 local synthetic load receipt (not production SLA)
        uses: actions/upload-artifact@v4
        with:
          name: m4-07-512m-sustained-${{ github.run_id }}
          path: .workspace/m4-performance/m4-07-compose-load.json
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose failed preview boot without exporting secrets
        if: failure()
        run: docker logs --tail 150 tb-preview-ci 2>/dev/null || true
      - name: Tear down and erase generated preview secrets
        if: always()
        run: |
          docker rm -f tb-preview-ci 2>/dev/null || true
          rm -f /tmp/therabridge-preview-ci.env
          rm -f .workspace/local-credentials/render-demo-passwords.json
          rm -f .workspace/local-credentials/render-demo-extra-passwords.json

  smart-targeted:
    name: smart-targeted
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'docs' || needs.smart-plan.outputs.mode == 'web-style'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Validate Smart CI policy and decision regression
        run: node --test scripts/ci/smart-ci.test.mjs scripts/ci/smart-ci-workflow.test.mjs
      - name: Validate canonical roadmap and historical registers
        run: |
          node scripts/qa/check-roadmap-registers.mjs
          node --test scripts/qa/check-roadmap-registers.test.mjs
          node scripts/qa/check-historic-issues.mjs
          node --test scripts/qa/check-historic-issues.test.mjs
      - name: Web-focused tests and production build
        if: needs.smart-plan.outputs.mode == 'web-style'
        run: |
          yarn install --frozen-lockfile
          yarn workspace @therabridge/web test
          yarn workspace @therabridge/web build
          node scripts/design/check-child360-logic.mjs

  smart-ci-gate:
    name: smart-ci-gate
    if: always()
    needs:
      - smart-plan
      - secret-scan
      - sbom
      - test
      - live-session
      - demo-journey
      - compose
      - preview-container
      - smart-targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every job required by the exact-commit Smart CI plan
        env:
          TB_SMART_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/smart-ci-gate.mjs
