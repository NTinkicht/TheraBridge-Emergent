      - name: Cache untrusted Next.js compiler intermediates (live-session)
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: tb-next-v2-${{ runner.os }}-${{ runner.arch }}-live-session-${{ hashFiles('yarn.lock') }}-${{ hashFiles('apps/web/src/**', 'apps/web/package.json', 'apps/web/next.config.*') }}
          restore-keys: |
            tb-next-v2-${{ runner.os }}-${{ runner.arch }}-live-session-${{ hashFiles('yarn.lock') }}-
      - run: yarn workspace @therabridge/web build
      # Cache only downloaded public Chromium binaries. Playwright still checks
      # the lockfile-pinned revision and installs system dependencies every run.
      # Never cache credentials, Node build outputs or clinical test state.
      - name: Cache Playwright Chromium downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: tb-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - run: yarn playwright install --with-deps chromium
      - name: Real two-tab browser → API → PostgreSQL synthetic regression
        run: node scripts/design/run-session-live.mjs
