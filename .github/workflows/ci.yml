name: ci

# Open PRs receive full application verification plus a distinct fast-load smoke.
# Main and v* release candidate tags retain full ten-minute endurance evidence.
# Feature-branch pushes must not duplicate expensive PR jobs; scheduled and
# manually dispatched runs retain full continuous endurance qualification.
on:
  push:
    branches: ["main"]
    tags: ["v*"] # Release candidates receive the exact-SHA full endurance gate.
  pull_request:
  schedule:
    - cron: "30 4 * * *" # Daily full M4-07 synthetic endurance on default branch.
  workflow_dispatch:

# Superseded runs of the same event/ref cancel; PR and main require independent
# full qualification because the eventual merge commit has a different tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smart-plan:
    name: smart-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      candidate: ${{ steps.select.outputs.candidate }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate complete PR diff and conservative risk plan
        id: select
        env:
          TB_SMART_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TB_SMART_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TB_SMART_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TB_SMART_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          TB_SMART_CI_MODE: ${{ vars.TB_SMART_CI_MODE }}
          TB_SMART_CI_REQUIRED_GATE_READY: ${{ vars.TB_SMART_CI_REQUIRED_GATE_READY }}
        run: node scripts/ci/smart-ci.mjs

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate SBOM contract and negative cases
        run: node --test scripts/commercial/check-sbom.test.mjs scripts/commercial/reconcile-sbom.test.mjs
      - name: Generate fresh CycloneDX source SBOM for this commit (includes yarn.lock)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: therabridge-source-${{ github.sha }}.cyclonedx.json
          output-file: /tmp/therabridge-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Reconcile lockfile-only packages and retain scanner provenance
        run: node scripts/commercial/reconcile-sbom.mjs /tmp/therabridge-source.cdx.json yarn.lock /tmp/therabridge-reconciled.cdx.json
      - name: Fail closed unless every Yarn resolved name/version is in source SBOM
        run: node scripts/commercial/check-sbom.mjs /tmp/therabridge-reconciled.cdx.json source
      - name: Verify upstream evidence ledger covers every direct dependency
        run: |
          node --test scripts/commercial/check-direct-evidence.test.mjs
          node scripts/commercial/check-direct-evidence.mjs
      - name: Validate license risk classifier and review queue invariants
        run: node --test scripts/commercial/classify-sbom.test.mjs
      - name: Classify all source components with approval fail-closed
        run: node scripts/commercial/classify-sbom.mjs /tmp/therabridge-reconciled.cdx.json /tmp/therabridge-license-review.json /tmp/therabridge-third-party-notices-REVIEW.md
      - name: Archive per-commit license review queue (not a legal clearance)
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-license-review-${{ github.sha }}
          path: |
            /tmp/therabridge-license-review.json
            /tmp/therabridge-third-party-notices-REVIEW.md
          if-no-files-found: error
          retention-days: 30
      - name: Archive reconciled CycloneDX SBOM for PR or main commit
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-source-${{ github.sha }}.cyclonedx.json
          path: /tmp/therabridge-reconciled.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate tracked brand/media/container asset evidence
        run: |
          node scripts/commercial/asset-inventory.mjs > /tmp/therabridge-assets.json
          node -e 'const a=require("/tmp/therabridge-assets.json");if(!a.total||!a.assets.every(x=>x.licenseStatus==="NOT_VERIFIED"))process.exit(1);console.log("Tracked asset entries:",a.total)'
      - name: Archive per-commit tracked-asset evidence
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-assets-${{ github.sha }}
          path: /tmp/therabridge-assets.json
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (version- and checksum-pinned)
        run: |
          # The GitHub release endpoint occasionally returns transient 5xx/504.
          # Retry the same pinned artifact; never skip the SHA-256 verification.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 90 \
            -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan full Git history (all fetched refs), values redacted
        run: |
          set +e
          /tmp/gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact=100 --no-banner --report-format=json --report-path=/tmp/tb-secret-scan.json --exit-code 1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            # Print rule, tracked file and source location only: NEVER leak matched text, snippets or secrets.
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/tb-secret-scan.json","utf8"));for(const x of a)console.log("SCAN_FINDING_RULE_PATH "+JSON.stringify({rule:x.RuleID,file:x.File,line:x.StartLine,commit:x.Commit}));'
          fi
          rm -f /tmp/tb-secret-scan.json
          exit "$result"
      - name: Scan tracked files in this checkout, values redacted
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1

  commercial-provenance:
    name: commercial-provenance
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full'
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install exact locked dependency tree for license and publisher evidence
        run: yarn install --frozen-lockfile
      - name: Collect installed package license-file hashes (review evidence only)
        run: node scripts/commercial/collect-installed-licenses.mjs . /tmp/therabridge-installed-licenses.json
      - name: Produce version-specific installed LICENSE/NOTICE triage (not legal approval)
        run: node scripts/commercial/build-installed-license-review.mjs /tmp/therabridge-installed-licenses.json /tmp/therabridge-installed-license-review.json
      - name: Reconcile exact installed versions to frozen Yarn lock metadata (not tarball verification)
        run: node scripts/commercial/reconcile-installed-lock.mjs /tmp/therabridge-installed-license-review.json yarn.lock /tmp/therabridge-installed-lock-provenance.json
      - name: Verify all installed direct npm tarballs and compare on-disk LICENSE/NOTICE hashes
        run: node scripts/commercial/verify-published-tarballs.mjs /tmp/therabridge-installed-lock-provenance.json yarn.lock docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-publisher-tarball-evidence.json
      - name: Collect transitive dependencies and tracked assets for legal-review matrix
        run: node scripts/commercial/build-com02-obligations-queue.mjs docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-publisher-tarball-evidence.json /tmp/therabridge-com02-obligations-queue.json
      - name: Classify every installed non-direct npm version and verify tarball hashes (not license clearance)
        run: node scripts/commercial/verify-transitive-tarballs.mjs /tmp/therabridge-installed-lock-provenance.json yarn.lock docs/commercial/direct-license-evidence.json /tmp/therabridge-installed-licenses.json /tmp/therabridge-transitive-tarball-evidence.json
      - name: Generate per-version unresolved license and SaaS/enterprise obligations register
        run: node scripts/commercial/build-license-exception-register.mjs /tmp/therabridge-publisher-tarball-evidence.json /tmp/therabridge-transitive-tarball-evidence.json /tmp/therabridge-installed-licenses.json yarn.lock /tmp/therabridge-com02-obligations-queue.json /tmp/therabridge-com02-exact-version-rights-queue.json
      - name: Collect immutable exact-version registry metadata candidates (never legal clearance)
        run: node scripts/commercial/collect-upstream-license-candidates.mjs /tmp/therabridge-com02-exact-version-rights-queue.json /tmp/therabridge-com02-upstream-candidates.json
      - name: Independently query npm CLI signatures for advertised exact-version candidates (not source or legal approval)
        run: node scripts/commercial/verify-npm-provenance-observation.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-npm-provenance-observation.json /tmp/therabridge-com02-npm-signature-audit.json
      - name: Obtain and verify exact npm package Sigstore bundles using pinned npm 11.19.1 (never legal approval)
        run: node scripts/commercial/verify-npm-sigstore-bundles.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-verified-npm-bundle-candidates.json /tmp/therabridge-com02-raw-verified-npm-bundles.json
      - name: Corroborate pinned signed Next.js release claims with immutable source manifests (not reproducibility)
        run: node scripts/commercial/corroborate-signed-nextjs-source.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-verified-npm-bundle-candidates.json /tmp/therabridge-com02-raw-verified-npm-bundles.json /tmp/therabridge-com02-nextjs-immutable-source-review.json
      - name: Record real npm release archive files, SRI and immutable source build recipes (not reproduced builds)
        run: node scripts/commercial/inventory-nextjs-published-builds.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-verified-npm-bundle-candidates.json /tmp/therabridge-com02-raw-verified-npm-bundles.json /tmp/therabridge-com02-nextjs-immutable-source-review.json /tmp/therabridge-com02-nextjs-published-build-readiness.json
      - name: Collect version-pinned source root manifest corroboration candidates (not legal authority)
        run: node scripts/commercial/corroborate-source-revisions.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-source-correspondence-candidates.json
      - name: Build exact DefinitelyTyped version-specific third-party rights followup receipt
        run: node scripts/commercial/build-definitelytyped-triage.mjs /tmp/therabridge-com02-upstream-candidates.json /tmp/therabridge-com02-source-correspondence-candidates.json /tmp/therabridge-com02-exact-version-rights-queue.json /tmp/therabridge-com02-definitelytyped-26-triage.json
      - name: Observe two real immutable DefinitelyTyped snapshots (NEVER publisher proof)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commercial/probe-dt-source-snapshots.mjs /tmp/therabridge-com02-definitelytyped-26-triage.json /tmp/therabridge-com02-dt-snapshot-probes.json
      - name: Observe two exact 2023 DefinitelyTyped source snapshots without publication authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commercial/probe-dt-prepublication-snapshots.mjs /tmp/therabridge-com02-definitelytyped-26-triage.json /tmp/therabridge-com02-dt-prepublication-probes.json
      - name: Corroborate 15 frozen source-root observations (9 current, 6 retired) against exact 44 npm candidate report without authorizing lineage
        run: node scripts/commercial/reconcile-independent-root-observations.mjs /tmp/therabridge-com02-source-correspondence-candidates.json docs/commercial/com02-independent-root-observations.json /tmp/therabridge-com02-root-observation-reconciliation.json
      - name: Reconcile immutable upstream text evidence without approving source correspondence
        run: node scripts/commercial/verify-immutable-license-texts.mjs /tmp/therabridge-com02-upstream-candidates.json docs/commercial/immutable-upstream-source-mappings.json /tmp/therabridge-com02-immutable-text-evidence.json
      - name: Build consolidated per-version and source-asset evidence (NEVER legal approval)
        run: node scripts/commercial/build-bulk-rights-evidence.mjs /tmp/therabridge-com02-exact-version-rights-queue.json /tmp/therabridge-com02-source-correspondence-candidates.json docs/commercial/upstream-license-path-candidates.json /tmp/therabridge-com02-bulk-rights-evidence.json
      - name: Assert commercial launch decision records remain non-authorizing
        run: |
          node --test scripts/commercial/verify-launch-decision.test.mjs
          node scripts/commercial/verify-launch-decision.mjs docs/commercial/launch-decision-register.json
      - name: Verify COM-05 commercial editions and nonclinical entitlement safety invariants
        run: |
          node --test scripts/commercial/verify-com05-policy.test.mjs
          node scripts/commercial/verify-com05-policy.mjs docs/commercial/com05-entitlement-design.json
      - name: Verify non-sensitive COM-01 ownership and contract counsel intake
        run: |
          node --test scripts/commercial/build-com01-counsel-packet.test.mjs
          node scripts/commercial/build-com01-counsel-packet.mjs \
            docs/commercial/ip-rights-evidence-register.md \
            docs/commercial/contracts/CONTRACT_PACK_DRAFT.md \
            docs/commercial/proposed-proprietary-notice.md \
            docs/commercial/com05-entitlement-design.json \
            /tmp/therabridge-com01-counsel-intake.json
      - name: Build conservative actual-image candidate comparison (unattested means unresolved)
        run: node scripts/commercial/review-release-scope.mjs /tmp/therabridge-com02-bulk-rights-evidence.json docs/commercial/release-file-evidence.json /tmp/therabridge-com02-release-scope-review.json
      - name: Generate fail-closed COM-02 per-component commercial rights and release blocker ledger
        run: |
          node scripts/commercial/build-com02-closure-ledger.mjs \
            /tmp/therabridge-com02-exact-version-rights-queue.json \
            /tmp/therabridge-com02-source-correspondence-candidates.json \
            /tmp/therabridge-com02-bulk-rights-evidence.json \
            /tmp/therabridge-com02-definitelytyped-26-triage.json \
            docs/commercial/release-file-evidence.json \
            /tmp/therabridge-com02-closure-ledger.json
      - name: Derive non-DefinitelyTyped workqueue from same-run COM-02 ledger (never approval)
        run: node scripts/commercial/build-com02-nondt-workqueue.mjs /tmp/therabridge-com02-closure-ledger.json /tmp/therabridge-com02-nondt-workqueue.json
      - name: Compare 9 observed npm source roots and flag tenth unobserved candidate (no attestation)
        run: |
          node scripts/commercial/compare-nondt-published-manifests.mjs \
            /tmp/therabridge-com02-nondt-workqueue.json \
            docs/commercial/com02-independent-root-observations.json \
            /tmp/therabridge-com02-root-observation-reconciliation.json \
            yarn.lock \
            /tmp/therabridge-com02-nondt-published-manifest-comparison.json
      - name: Verify immutable unicode-emoji-modifier-base source vs exact original npm archive (not publisher approval)
        run: |
          node scripts/commercial/verify-com02-root-405.mjs \
            /tmp/therabridge-com02-nondt-workqueue.json \
            yarn.lock \
            /tmp/therabridge-com02-root-405-evidence.json
      - name: Reproduce exact tokenizer npm manifest field differences without publisher attribution
        run: |
          node scripts/commercial/classify-com02-tokenizer-manifest-drift.mjs \
            /tmp/therabridge-com02-nondt-workqueue.json \
            docs/commercial/com02-independent-root-observations.json \
            /tmp/therabridge-com02-nondt-published-manifest-comparison.json \
            yarn.lock \
            /tmp/therabridge-com02-tokenizer-manifest-diff-402.json
      - name: Independently compare immutable tokenizer Git source and original locked npm manifest (not publisher attestation)
        run: |
          node scripts/commercial/explain-com02-tokenizer-402.mjs \
            /tmp/therabridge-com02-nondt-workqueue.json \
            yarn.lock \
            /tmp/therabridge-com02-tokenizer-exact-semantic-402.json
      - name: Batch reconcile WU-LIC-01 provenance qualifications without granting commercial or clinical rights
        run: |
          node scripts/commercial/build-wu-lic-01-qualification.mjs \
            /tmp/therabridge-com02-closure-ledger.json \
            /tmp/therabridge-com02-root-405-evidence.json \
            /tmp/therabridge-com02-tokenizer-exact-semantic-402.json \
            /tmp/therabridge-com02-nondt-published-manifest-comparison.json \
            /tmp/therabridge-wu-lic-01-provenance-qualification.json
      - name: Test WU-LIC-02 44 npm and 91 asset dual-edition rights/provenance
        run: node --test scripts/commercial/build-wu-lic-02-edition-rights-queue.test.mjs
      - name: Build WU-LIC-02 per-edition fail-closed source, asset and release counsel queue
        run: |
          node scripts/commercial/build-wu-lic-02-edition-rights-queue.mjs \
            /tmp/therabridge-com02-closure-ledger.json \
            /tmp/therabridge-com02-root-405-evidence.json \
            /tmp/therabridge-com02-tokenizer-exact-semantic-402.json \
            /tmp/therabridge-com02-nondt-published-manifest-comparison.json \
            /tmp/therabridge-wu-lic-01-provenance-qualification.json \
            docs/commercial/release-file-evidence.json \
            /tmp/therabridge-wu-lic-02-edition-rights-queue.json
      - name: Build non-authorizing WU-LIC-03 counsel-ready SaaS and Enterprise launch gate matrix
        run: |
          node scripts/commercial/build-wu-lic-03-counsel-gates.mjs \
            /tmp/therabridge-wu-lic-02-edition-rights-queue.json \
            docs/commercial/launch-decision-register.json \
            /tmp/therabridge-wu-lic-03-counsel-launch-readiness.json
      - name: Archive installed license evidence for full CI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: therabridge-installed-license-files-${{ github.sha }}
          path: |
            /tmp/therabridge-installed-licenses.json
            /tmp/therabridge-installed-license-review.json
            /tmp/therabridge-installed-lock-provenance.json
            /tmp/therabridge-publisher-tarball-evidence.json
            /tmp/therabridge-com02-obligations-queue.json
            /tmp/therabridge-transitive-tarball-evidence.json
            /tmp/therabridge-com02-exact-version-rights-queue.json
            /tmp/therabridge-com02-upstream-candidates.json
            /tmp/therabridge-com02-npm-provenance-observation.json
            /tmp/therabridge-com02-npm-signature-audit.json
            /tmp/therabridge-com02-verified-npm-bundle-candidates.json
            /tmp/therabridge-com02-raw-verified-npm-bundles.json
            /tmp/therabridge-com02-nextjs-immutable-source-review.json
            /tmp/therabridge-com02-nextjs-published-build-readiness.json
            /tmp/therabridge-com02-source-correspondence-candidates.json
            /tmp/therabridge-com02-definitelytyped-26-triage.json
            /tmp/therabridge-com02-dt-snapshot-probes.json
            /tmp/therabridge-com02-dt-prepublication-probes.json
            /tmp/therabridge-com02-closure-ledger.json
            /tmp/therabridge-com02-nondt-workqueue.json
            /tmp/therabridge-com02-nondt-published-manifest-comparison.json
            /tmp/therabridge-com02-root-405-evidence.json
            /tmp/therabridge-com02-tokenizer-exact-semantic-402.json
            /tmp/therabridge-wu-lic-01-provenance-qualification.json
            /tmp/therabridge-wu-lic-02-edition-rights-queue.json
            /tmp/therabridge-wu-lic-03-counsel-launch-readiness.json
            /tmp/therabridge-com02-tokenizer-manifest-diff-402.json
            /tmp/therabridge-com02-root-observation-reconciliation.json
            /tmp/therabridge-com02-bulk-rights-evidence.json
            /tmp/therabridge-com02-release-scope-review.json
            /tmp/therabridge-com02-immutable-text-evidence.json
          if-no-files-found: error
          retention-days: 30

  commercial-contracts:
    name: commercial-contracts
    needs: smart-plan
    if: needs.smart-plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install exact locked dependency tree for independent offline commercial contracts
        run: yarn install --frozen-lockfile
      - name: Verify exact-installed package license file inventory tooling
        run: node --test scripts/commercial/collect-installed-licenses.test.mjs
      - name: Validate installed license review triage and fail-closed safeguards
        run: node --test scripts/commercial/build-installed-license-review.test.mjs
      - name: Validate Yarn lockfile installed-provenance review and adversarial fixtures
        run: node --test scripts/commercial/reconcile-installed-lock.test.mjs
      - name: Validate published tarball verification tooling (offline adversarial tests)
        run: node --test scripts/commercial/verify-published-tarballs.test.mjs
      - name: Verify digest-pinned candidate Docker release capture parser (offline, fail-closed)
        run: python3 -m unittest discover -s scripts/commercial -p test_capture_docker_release.py -v
      - name: Test independent WU-LIC-03 per-edition legal, IP and clinical launch approval gates
        run: node --test scripts/commercial/build-wu-lic-03-counsel-gates.test.mjs
      - name: Validate post-V1 WU-LIC-04 commercial activation spec before freeze (no runtime enablement)
        run: |
          node --test scripts/commercial/validate-wu-lic-04-spec.test.mjs
          node scripts/commercial/validate-wu-lic-04-spec.mjs docs/commercial/wu-lic-04-activation-contract.json
      - name: Validate consolidated transitive and asset obligations queue
        run: node --test scripts/commercial/build-com02-obligations-queue.test.mjs
      - name: Validate bounded transitive publisher tarball audit safeguards
        run: node --test scripts/commercial/verify-transitive-tarballs.test.mjs
      - name: Validate exact-version license exception register fail-closed semantics
        run: node --test scripts/commercial/build-license-exception-register.test.mjs
      - name: Validate exact npm registry manifest metadata candidates fail-closed
        run: node --test scripts/commercial/collect-upstream-license-candidates.test.mjs
      - name: Validate npm attestation discovery and fail-closed signature audit receipts
        run: node --test scripts/commercial/verify-npm-provenance-observation.test.mjs
      - name: Validate pinned npm Sigstore bundle subject and digest verifier (adversarial offline)
        run: node --test scripts/commercial/verify-npm-sigstore-bundles.test.mjs
      - name: Validate signed Next.js source-to-exact-commit evidence boundaries
        run: node --test scripts/commercial/corroborate-signed-nextjs-source.test.mjs
      - name: Validate exact npm published tarball inventory and source build-recipe boundaries
        run: node --test scripts/commercial/inventory-nextjs-published-builds.test.mjs
      - name: Verify independently SRI-authenticated published npm archive comparator
        run: node --test scripts/commercial/compare-nextjs-rebuild.test.mjs
      - name: Validate candidate Git commit and immutable source package identity without false attestation
        run: node --test scripts/commercial/corroborate-source-revisions.test.mjs
      - name: Validate exact pinned DefinitelyTyped (21) unresolved source lineage and rights targets
        run: node --test scripts/commercial/build-definitelytyped-triage.test.mjs
      - name: Validate exact-Git DefinitelyTyped hash reconstruction boundaries
        run: node --test scripts/commercial/verify-dt-immutable-source.test.mjs
      - name: Validate 2023 prepublication immutable source comparison safety
        run: node --test scripts/commercial/probe-dt-prepublication-snapshots.test.mjs
      - name: Validate immutable-source root observations, aliases, and false-approval boundaries
        run: node --test scripts/commercial/reconcile-independent-root-observations.test.mjs
      - name: Validate fail-closed exact-commit LICENSE/NOTICE text hashing
        run: node --test scripts/commercial/verify-immutable-license-texts.test.mjs
      - name: Validate bulk provenance and immutable LICENSE/NOTICE candidate rights queue fail-closed
        run: node --test scripts/commercial/build-bulk-rights-evidence.test.mjs
