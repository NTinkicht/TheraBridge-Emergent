name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (version- and checksum-pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan full Git history (all fetched refs), values redacted
        run: /tmp/gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact=100 --no-banner --exit-code 1
      - name: Scan tracked files in this checkout, values redacted
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner --exit-code 1

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@localhost:5432/therabridge_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - name: Required portability files are present
        run: |
          for f in yarn.lock .env.example apps/api/.env.example apps/web/.env.example .nvmrc; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - name: Check additive migration after TB-EM-012 was already applied
        run: |
          # Migrate the CI database using the original through-012 chain first,
          # then deploy current migrations against the SAME persisted database.
          # This catches in-place migration edits that fresh-database CI misses.
          mkdir -p /tmp/therabridge-prior
          cp apps/api/prisma/schema.prisma /tmp/therabridge-prior/schema.prisma
          cp -a apps/api/prisma/migrations /tmp/therabridge-prior/migrations
          rm -rf /tmp/therabridge-prior/migrations/20261030090000_tb_em_013_guardian_audience_requires_recipient
          rm -rf /tmp/therabridge-prior/migrations/20261101090000_tb_em_015_session_execution
          yarn workspace @therabridge/api prisma migrate deploy --schema /tmp/therabridge-prior/schema.prisma
          yarn workspace @therabridge/api prisma migrate deploy
          # The strengthened guardian constraint must now be present.
          # Prisma confirms all migrations applied on the previously migrated database.
          yarn workspace @therabridge/api prisma migrate status
      - run: yarn workspace @therabridge/api typecheck
      - run: yarn workspace @therabridge/api test
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - run: node scripts/design/check-child360-logic.mjs
      - name: TB-EM-051 clinical transfer must remain unapproved and non-authorizing
        run: node scripts/qa/verify-tb-em-051-gates.mjs
      - run: node scripts/qa/verify-independent-review.mjs
        env:
          API_UPSTREAM_ORIGIN: http://127.0.0.1:8001

      - name: Session editor responsive DOM and synthetic dictation regression
        run: |
          yarn playwright install --with-deps chromium
          (cd apps/web && yarn start) > /tmp/therabridge-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/design/check-preview-entry.mjs
          node scripts/design/check-session-workflow.mjs

  live-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_live_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_live_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_live_test?schema=public
      DEPLOYMENT_ENV: ci
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - run: yarn workspace @therabridge/api prisma migrate deploy
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - run: yarn playwright install --with-deps chromium
      - name: Real two-tab browser → API → PostgreSQL synthetic regression
        run: node scripts/design/run-session-live.mjs
      # Never upload seed credentials, browser storage, or traces.
      - if: always()
        run: rm -f .workspace/local-credentials/synthetic-accounts.json

  demo-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_demo_test?schema=public
      DEPLOYMENT_ENV: ci
      API_UPSTREAM_ORIGIN: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @therabridge/api prisma generate
      - run: yarn workspace @therabridge/api prisma migrate deploy
      - run: yarn workspace @therabridge/api typecheck
      - run: yarn workspace @therabridge/api build
      - run: yarn workspace @therabridge/web build
      - run: yarn playwright install --with-deps chromium
      - name: Idempotent synthetic Ahmed seed and real seven-role browser journey
        run: node scripts/design/run-demo-live.mjs
      - if: always()
        run: rm -f .workspace/local-credentials/childrens-home-demo.json

  compose:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test through the running containers
        run: |
          curl -fsS http://localhost:8001/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "ok" and h["service"] == "therabridge-api" and h["database"]["status"] == "up" and h["migrations"]["applied"] >= 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/api/health/probe -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' -d '{"source":"cli"}')" = 404
          # Root is now the actual app, not TB-EM-000.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 307
          curl -fsS http://localhost:3000/login | grep -q 'Sign in to TheraBridge'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dev/feasibility)" = 404
          curl -fsS http://localhost:3000/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"]=="ok" and h["database"]["status"]=="up"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/health/probe -H 'Origin: https://untrusted.example' -H 'Content-Type: application/json' -d '{}')" = 403
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v


  preview-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: therabridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: therabridge_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therabridge -d therabridge_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify preview entrypoint and public smoke syntax
        run: |
          bash -n scripts/preview/start.sh
          node --check scripts/preview/check-external.mjs
          node --check scripts/preview/generate-secrets.mjs
      - name: Build unified preview image
        run: docker build -f Dockerfile.preview -t tb-synthetic-preview:ci .
      - name: Start isolated preview with disposable test passwords
        run: |
          umask 077
          node scripts/preview/generate-secrets.mjs
          cat > /tmp/therabridge-preview-ci.env <<'EOF'
          DATABASE_URL=postgresql://therabridge:ci_only_password@127.0.0.1:5432/therabridge_demo_test?schema=public
          DEPLOYMENT_ENV=preview
          DEMO_SEED_CONFIRM=CHILDRENS_HOME_SYNTHETIC_ONLY
          COOKIE_SECURE=true
          FAMILY_MESSAGING_DEMO=false
          PORT=10000
          API_UPSTREAM_ORIGIN=http://127.0.0.1:8001
          RENDER_EXTERNAL_HOSTNAME=therabridge-ahmed-synthetic-demo.onrender.com
          EOF
          printf 'DEMO_PASSWORDS_JSON=%s\n' "$(tr -d '\n' < .workspace/local-credentials/render-demo-passwords.json)" >> /tmp/therabridge-preview-ci.env
          printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> /tmp/therabridge-preview-ci.env
          docker run -d --name tb-preview-ci --network host --env-file /tmp/therabridge-preview-ci.env tb-synthetic-preview:ci
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:10000/login >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/login | grep -q 'Sign in to TheraBridge'
          curl -fsS http://127.0.0.1:10000/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["database"]["status"]=="up" and h["migrations"]["applied"]>=16'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/dev/feasibility)" = 404
          docker exec tb-preview-ci node -e "const {PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.center.count({where:{slug:'childrens-home-demo'}}).then(n=>{if(n!==1)process.exitCode=1;else console.log('PASS: one Children Home demo centre seeded')}).finally(()=>p.\$disconnect())"
      - name: Diagnose failed preview boot without exporting secrets
        if: failure()
        run: docker logs --tail 150 tb-preview-ci 2>/dev/null || true
      - name: Tear down and erase generated preview secrets
        if: always()
        run: |
          docker rm -f tb-preview-ci 2>/dev/null || true
          rm -f /tmp/therabridge-preview-ci.env
          rm -f .workspace/local-credentials/render-demo-passwords.json
